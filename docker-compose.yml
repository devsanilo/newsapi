# Noozia API — Docker Compose (API + Worker + MySQL + Redis)
# Deployable to Dokploy (or any Docker host). Env overrides come from
# a .env file placed next to this compose file, or from the platform's env UI.
name: noozia

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_NAME:-news_aggregator}
      # Non-root app user — must NOT be "root"
      MYSQL_USER: ${MYSQL_USER:-noozia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-noozia_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-noozia_root_pass}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${MYSQL_ROOT_PASSWORD:-noozia_root_pass}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: noozia-api:latest
    build: .
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment: &app-env
      NODE_ENV: production
      PORT: "3000"
      # Database (compose service "db") — app user is MYSQL_USER/MYSQL_PASSWORD
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-news_aggregator}
      DB_USER: ${MYSQL_USER:-noozia}
      DB_PASSWORD: ${MYSQL_PASSWORD:-noozia_pass}
      DB_SSL: ${DB_SSL:-false}
      # Redis (compose service "redis")
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Auth
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Crawler
      CRAWLER_CONCURRENCY: ${CRAWLER_CONCURRENCY:-3}
      CRAWLER_MAX_RETRIES: ${CRAWLER_MAX_RETRIES:-3}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-*/30 * * * *}
      PUPPETEER_HEADLESS: "true"
      # API
      APP_URL: ${APP_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional integrations (leave empty to disable)
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      VIDEO_FEED_URLS: ${VIDEO_FEED_URLS:-}
    volumes:
      - api-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: noozia-api:latest
    build: .
    command: ["node", "src/jobs/worker.js"]
    restart: unless-stopped
    environment: *app-env
    volumes:
      - worker-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db-data:
  redis-data:
  api-logs:
  worker-logs:
